<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeroLoad // Cargo Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
      
      body {
        background-color: #000000; 
        font-family: 'JetBrains Mono', monospace;
        color: #ffffff;
      }

      /* Custom Scrollbar for BW look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333333; 
        border-radius: 0px;
        border: 1px solid #ffffff;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffffff; 
      }

      .scan-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.05) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
      }
      
      .hud-border {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(0, 0, 0, 0.8);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
      }
      
      .hud-corner::before, .hud-corner::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        border-color: #ffffff; 
        border-style: solid;
        transition: all 0.3s ease;
      }
      .hud-corner::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
      .hud-corner::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    </style>
